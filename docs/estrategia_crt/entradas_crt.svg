<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="831" viewBox="0 0 680 565" font-family="Segoe UI, Arial, sans-serif"><rect width="680" height="565" fill="#ffffff"/><text x="20" y="26" font-size="16" font-weight="600" fill="#222">Los 4 modelos de entrada del CRT, sobre el mismo corto</text><rect x="100" y="125" width="165" height="18" fill="#CECBF6" stroke="#7F77DD" stroke-width="0.8"/><line x1="200" y1="80" x2="600" y2="80" stroke="#E24B4A" stroke-dasharray="5 4"/><text x="606" y="84" font-size="12" fill="#A32D2D">SL</text><text x="200" y="66" font-size="12" fill="#333" text-anchor="middle">Sweep</text><text x="96" y="141" font-size="12" fill="#534AB7" text-anchor="end">iFVG</text><line x1="110" y1="175" x2="310" y2="175" stroke="#7F77DD" stroke-dasharray="3 3"/><text x="96" y="192" font-size="12" fill="#534AB7" text-anchor="end">Nivel CISD</text><line x1="110" y1="143" x2="110" y2="180" stroke="#333"/><rect x="101" y="150" width="18" height="25" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/><line x1="155" y1="118" x2="155" y2="155" stroke="#333"/><rect x="146" y="125" width="18" height="25" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/><line x1="200" y1="80" x2="200" y2="125" stroke="#333"/><rect x="191" y="100" width="18" height="27" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/><line x1="245" y1="95" x2="245" y2="152" stroke="#333"/><rect x="236" y="102" width="18" height="46" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><line x1="290" y1="143" x2="290" y2="188" stroke="#333"/><rect x="281" y="148" width="18" height="34" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><line x1="335" y1="184" x2="335" y2="210" stroke="#333"/><rect x="326" y="188" width="18" height="17" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><line x1="380" y1="205" x2="380" y2="240" stroke="#333"/><rect x="371" y="205" width="18" height="30" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><line x1="425" y1="143" x2="425" y2="240" stroke="#333"/><rect x="416" y="150" width="18" height="85" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.8"/><line x1="470" y1="148" x2="470" y2="265" stroke="#333"/><rect x="461" y="150" width="18" height="110" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><line x1="515" y1="262" x2="515" y2="335" stroke="#333"/><rect x="506" y="260" width="18" height="70" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><line x1="560" y1="332" x2="560" y2="400" stroke="#333"/><rect x="551" y="330" width="18" height="65" fill="#F5C4B3" stroke="#993C1D" stroke-width="0.8"/><circle cx="335" cy="188" r="9" fill="#378ADD" stroke="#333" stroke-width="0.8"/><text x="335" y="192.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><circle cx="425" cy="143" r="9" fill="#7F77DD" stroke="#333" stroke-width="0.8"/><text x="425" y="147.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><circle cx="425" cy="235" r="9" fill="#D4537E" stroke="#333" stroke-width="0.8"/><text x="425" y="239.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><circle cx="290" cy="182" r="9" fill="#EF9F27" stroke="#333" stroke-width="0.8"/><text x="290" y="186.5" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">4</text><text x="20" y="428" font-size="13" font-weight="600" fill="#222">Modelo · dónde entra · riesgo hasta el SL (barra)</text><circle cx="28" cy="446" r="7" fill="#378ADD" stroke="#333" stroke-width="0.8"/><text x="28" y="450" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">1</text><text x="44" y="450" font-size="12" fill="#222"><tspan font-weight="600">Vela siguiente al CISD:</tspan> a la apertura de la vela posterior a la del CISD</text><rect x="601" y="441" width="59" height="8" fill="#378ADD" opacity="0.8"/><circle cx="28" cy="467" r="7" fill="#7F77DD" stroke="#333" stroke-width="0.8"/><text x="28" y="471" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">2</text><text x="44" y="471" font-size="12" fill="#222"><tspan font-weight="600">Retesteo del iFVG:</tspan> cuando el precio vuelve a tocar el iFVG (si no vuelve, no hay entrada)</text><rect x="625" y="462" width="35" height="8" fill="#7F77DD" opacity="0.8"/><circle cx="28" cy="488" r="7" fill="#D4537E" stroke="#333" stroke-width="0.8"/><text x="28" y="492" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">3</text><text x="44" y="492" font-size="12" fill="#222"><tspan font-weight="600">Primera vela sin mecha:</tspan> a la apertura de la vela posterior a la primera bajista sin mecha</text><rect x="575" y="483" width="85" height="8" fill="#D4537E" opacity="0.8"/><circle cx="28" cy="509" r="7" fill="#EF9F27" stroke="#333" stroke-width="0.8"/><text x="28" y="513" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4</text><text x="44" y="513" font-size="12" fill="#222"><tspan font-weight="600">Cierre del CISD:</tspan> al cierre de la propia vela del CISD, sin esperar a la siguiente</text><rect x="604" y="504" width="56" height="8" fill="#EF9F27" opacity="0.8"/><text x="20" y="545" font-size="11" fill="#555">Riesgo = distancia de la entrada al SL. El 2 deja el menor, pero puede no llegar a entrar;</text><text x="20" y="559" font-size="11" fill="#555">el 4 es la entrada más temprana de las que entran siempre, y el 3 es la más tardía.</text></svg>