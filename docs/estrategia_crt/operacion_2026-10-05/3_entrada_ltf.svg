a en</text><text x="56.0" y="709" font-size="13" fill="#334155">M5 (zona 30,855.00–30,857.25). La vela de las</text><text x="56.0" y="728" font-size="13" fill="#334155">04:25 cierra bajo su base (30,855.00): el FVG se</text><text x="56.0" y="747" font-size="13" fill="#334155">invierte (iFVG).</text><rect x="420.0" y="640" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/><text x="436.0" y="666" font-size="15" font-weight="700" fill="#7c3aed">Paso 4 · CISD</text><text x="436.0" y="690" font-size="13" fill="#334155">La secuencia de velas alcistas que hizo el sweep</text><text x="436.0" y="709" font-size="13" fill="#334155">abrió en 30,844.50. A las 04:25 una vela cierra</text><text x="436.0" y="728" font-size="13" fill="#334155">por debajo (30,844.00): cambio de entrega. Se mide</text><text x="436.0" y="747" font-size="13" fill="#334155">en el mismo TF (M5).</text><rect x="800.0" y="640" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="816.0" y="666" font-size="15" font-weight="700" fill="#2563eb">Paso 5 · entrada y gestión</text><text x="816.0" y="690" font-size="13" fill="#334155">Entrada 1 en M5: a mercado en 30,843.00. Stop en</text><text x="816.0" y="709" font-size="13" fill="#334155">el extremo del sweep (30,883.50), riesgo 40.50</text><text x="816.0" y="728" font-size="13" fill="#334155">pts. TP 2R en 30,762.00; a 1R (30,802.50) el stop</text><text x="816.0" y="747" font-size="13" fill="#334155">pasa a la entrada. Resultado: objetivo, +2.00 R</text><text x="816.0" y="766" font-size="13" fill="#334155">bruto (+1.94 R con spread).</text></svg>