;stroke-width:4px;stroke-linejoin:round"><tspan x="1034.5" dy="0">CRH (máximo de C1) 30,875.25</tspan></text><circle cx="618.1" cy="394.1" r="7" fill="none" stroke="#dc2626" stroke-width="2.2"/><text x="401.9" y="248.7" font-size="13" font-weight="700" fill="#c2410c" text-anchor="start" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round"><tspan x="401.9" dy="0">FVG bajista M60: 30,875.25–30,885.50</tspan><tspan x="401.9" dy="16">vela 3 cerrada 05/10 01:00, sin mitigar</tspan></text><line x1="674.1" y1="348.1" x2="627.1" y2="388.1" stroke="#dc2626" stroke-width="1.6" marker-end="url(#arr-dc2626)"/><text x="680.1" y="342.1" font-size="13" font-weight="700" fill="#dc2626" text-anchor="start" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round"><tspan x="680.1" dy="0">El máximo del sweep (04:15, 30,883.50)</tspan><tspan x="680.1" dy="16">entra en el FVG</tspan></text><text x="54.0" y="558.0" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round"><tspan x="54.0" dy="0">MTF M60 · 02/10 11:00 – 05/10 16:00 NY · franja ámbar: la vela C2 (H3)</tspan></text><rect x="40.0" y="610" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#c2410c" stroke-width="1.5"/><text x="56.0" y="636" font-size="15" font-weight="700" fill="#c2410c">Paso 2 · FVG de MTF tocado (liquidez interna)</text><text x="56.0" y="660" font-size="13" fill="#334155">FVG bajista de M60: el hueco que dejan la mecha de</text><text x="56.0" y="679" font-size="13" fill="#334155">la vela 1 y la de la 3. Zona 30,875.25–30,885.50,</text><text x="56.0" y="698" font-size="13" fill="#334155">formada el 05/10 a las 00:00–01:00.</text><rect x="420.0" y="610" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/><text x="436.0" y="636" font-size="15" font-weight="700" fill="#16a34a">Lo que se comprueba</text><text x="436.0" y="660" font-size="13" fill="#334155">✓ El FVG ya estaba formado cuando empezó el sweep</text><text x="436.0" y="679" font-size="13" fill="#334155">✓ Sin mitigar: el precio no había entrado en la</text><text x="436.0" y="698" font-size="13" fill="#334155">zona desde su formación</text><text x="436.0" y="717" font-size="13" fill="#334155">✓ El extremo del sweep (30,883.50) cae dentro de</text><text x="436.0" y="736" font-size="13" fill="#334155">la zona</text><rect x="800.0" y="610" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="816.0" y="636" font-size="15" font-weight="700" fill="#64748b">Por qué importa</text><text x="816.0" y="660" font-size="13" fill="#334155">Además de la liquidez externa (el extremo de C1)</text><text x="816.0" y="679" font-size="13" fill="#334155">el precio ha tomado liquidez interna: un</text><text x="816.0" y="698" font-size="13" fill="#334155">desequilibrio que ya existía. Es la confirmación</text><text x="816.0" y="717" font-size="13" fill="#334155">de que el sweep llegó a una zona con órdenes.</text><text x="816.0" y="736" font-size="13" fill="#334155">Siguiente paso: bajar a M5 y buscar el iFVG.</text></svg>