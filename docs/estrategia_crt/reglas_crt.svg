<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1430" width="1200" height="1430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1200" height="1430" fill="#f8fafc"/>

  <!-- Cabecera -->
  <text x="40" y="58" font-size="34" font-weight="700" fill="#0f172a">CRT · reglas de la estrategia (variante B)</text>
  <text x="40" y="90" font-size="16" fill="#475569">Sweep en HTF → FVG → iFVG → CISD → entrada. Si falta un paso, no hay trade. Se muestra el largo; el corto es el espejo.</text>

  <g font-size="14" font-weight="600">
    <rect x="40" y="116" width="250" height="40" rx="20" fill="#dbeafe"/><text x="165" y="141" text-anchor="middle" fill="#1e40af">Índices: HTF H3 · NAS100</text>
    <rect x="304" y="116" width="170" height="40" rx="20" fill="#dbeafe"/><text x="389" y="141" text-anchor="middle" fill="#1e40af">Forex: HTF H4</text>
    <rect x="488" y="116" width="190" height="40" rx="20" fill="#dbeafe"/><text x="583" y="141" text-anchor="middle" fill="#1e40af">MTF (FVG): M15 / M30 / H1</text>
    <rect x="692" y="116" width="230" height="40" rx="20" fill="#dbeafe"/><text x="807" y="141" text-anchor="middle" fill="#1e40af">LTF (iFVG y entrada): M5 / M3</text>
    <rect x="936" y="116" width="224" height="40" rx="20" fill="#dbeafe"/><text x="1048" y="141" text-anchor="middle" fill="#1e40af">Cierre de sesión 18:00 NY</text>
  </g>

  <!-- Pasos 1-4 -->
  <g>
    <rect x="40" y="190" width="660" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="82" cy="249" r="22" fill="#2563eb"/><text x="82" y="257" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">1</text>
    <text x="122" y="222" font-size="19" font-weight="700" fill="#0f172a">Sweep en HTF</text>
    <text x="122" y="248" font-size="14.5" fill="#334155">Una vela H3 (índices) o H4 (forex) barre el mínimo (máximo) de la</text>
    <text x="122" y="268" font-size="14.5" fill="#334155">vela anterior (C1) y cierra de nuevo dentro de su rango.</text>
    <text x="122" y="290" font-size="14.5" font-weight="600" fill="#16a34a">Barre mínimo → largo · barre máximo → corto</text>

    <rect x="40" y="322" width="660" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="82" cy="381" r="22" fill="#2563eb"/><text x="82" y="389" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">2</text>
    <text x="122" y="354" font-size="19" font-weight="700" fill="#0f172a">FVG tocado en MTF (M15, M30 o H1)</text>
    <text x="122" y="380" font-size="14.5" fill="#334155">El extremo del sweep toca un FVG de MTF ya formado: además de la</text>
    <text x="122" y="400" font-size="14.5" fill="#334155">liquidez externa se toma liquidez interna.</text>
    <text x="122" y="422" font-size="14.5" font-weight="600" fill="#dc2626">Sin FVG tocado: no hay trade</text>

    <rect x="40" y="454" width="660" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="82" cy="513" r="22" fill="#2563eb"/><text x="82" y="521" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">3</text>
    <text x="122" y="486" font-size="19" font-weight="700" fill="#0f172a">iFVG en M5 o M3</text>
    <text x="122" y="512" font-size="14.5" fill="#334155">El sweep deja un FVG en M5/M3 y una vela cierra al otro lado: el FVG</text>
    <text x="122" y="532" font-size="14.5" fill="#334155">se invierte (iFVG). El TF donde aparece pasa a ser el TF de entrada.</text>
    <text x="122" y="554" font-size="14.5" font-weight="600" fill="#dc2626">Sin iFVG: no hay setup</text>

    <rect x="40" y="586" width="660" height="118" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <circle cx="82" cy="645" r="22" fill="#7c3aed"/><text x="82" y="653" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">4</text>
    <text x="122" y="618" font-size="19" font-weight="700" fill="#0f172a">CISD (Change in State of Delivery)</text>
    <text x="122" y="644" font-size="14.5" fill="#334155">Cierre más allá de la apertura de la secuencia de velas del mismo color</text>
    <text x="122" y="664" font-size="14.5" fill="#334155">que hizo el sweep (largos: cierre sobre la apertura de las bajistas).</text>
    <text x="122" y="686" font-size="14.5" font-weight="600" fill="#7c3aed">Se mide en el TF del iFVG (M5 o M3)</text>
  </g>

  <!-- Esquema (largo) -->
  <rect x="730" y="190" width="430" height="514" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="750" y="218" font-size="15" font-weight="700" fill="#0f172a">Esquema de un largo (no está a escala)</text>
  <g transform="translate(760,240) scale(0.88)" font-size="12">
    <!-- niveles -->
    <line x1="10" y1="31" x2="395" y2="31" stroke="#16a34a" stroke-width="1.5"/>
    <text x="395" y="25" text-anchor="end" fill="#16a34a" font-weight="700">TP 2R</text>
    <line x1="10" y1="163" x2="395" y2="163" stroke="#d97706" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="395" y="157" text-anchor="end" fill="#d97706" font-weight="700">1R · BE</text>
    <line x1="10" y1="427" x2="395" y2="427" stroke="#dc2626" stroke-width="1.5"/>
    <text x="395" y="443" text-anchor="end" fill="#dc2626" font-weight="700">SL</text>
    <line x1="10" y1="395" x2="395" y2="395" stroke="#64748b" stroke-width="1" stroke-dasharray="3 4"/>
    <text x="14" y="388" fill="#64748b">mínimo de C1</text>
    <line x1="90" y1="305" x2="300" y2="305" stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="96" y="299" fill="#7c3aed" font-weight="700">nivel CISD</text>

    <!-- C1 -->
    <line x1="48" y1="215" x2="48" y2="395" stroke="#94a3b8" stroke-width="2"/>
    <rect x="38" y="245" width="20" height="100" fill="#cbd5e1" stroke="#94a3b8"/>
    <text x="48" y="470" text-anchor="middle" fill="#64748b">C1</text>

    <!-- FVG bajista -->
    <rect x="90" y="340" width="110" height="20" fill="#fb923c" opacity="0.35"/>
    <text x="151" y="354" font-size="11" fill="#c2410c" font-weight="700">FVG</text>

    <!-- velas bajistas (secuencia que hace el sweep) -->
    <line x1="100" y1="305" x2="100" y2="340" stroke="#dc2626" stroke-width="2"/>
    <rect x="92" y="305" width="16" height="30" fill="#dc2626"/>
    <line x1="140" y1="340" x2="140" y2="375" stroke="#dc2626" stroke-width="2"/>
    <rect x="132" y="340" width="16" height="35" fill="#dc2626"/>
    <line x1="180" y1="360" x2="180" y2="420" stroke="#dc2626" stroke-width="2"/>
    <rect x="172" y="375" width="16" height="30" fill="#dc2626"/>
    <text x="180" y="470" text-anchor="middle" fill="#dc2626">sweep</text>
    <path d="M180 440 L180 422" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a)"/>

    <!-- velas alcistas -->
    <line x1="220" y1="326" x2="220" y2="402" stroke="#16a34a" stroke-width="2"/>
    <rect x="212" y="330" width="16" height="70" fill="#16a34a"/>
    <text x="220" y="470" text-anchor="middle" fill="#0f172a">iFVG</text>
    <text x="220" y="484" text-anchor="middle" fill="#64748b">cierra sobre el FVG</text>

    <line x1="260" y1="290" x2="260" y2="340" stroke="#16a34a" stroke-width="2"/>
    <rect x="252" y="295" width="16" height="40" fill="#16a34a"/>
    <circle cx="260" cy="278" r="9" fill="#7c3aed"/><text x="260" y="282" text-anchor="middle" fill="#fff" font-weight="700">C</text>
    <text x="260" y="470" text-anchor="middle" fill="#7c3aed" font-weight="700">CISD</text>

    <!-- ① -->
    <line x1="300" y1="262" x2="300" y2="300" stroke="#16a34a" stroke-width="2"/>
    <rect x="292" y="275" width="16" height="20" fill="#16a34a"/>
    <circle cx="300" cy="250" r="10" fill="#2563eb"/><text x="300" y="254" text-anchor="middle" fill="#fff" font-weight="700">1</text>

    <!-- retroceso ② -->
    <line x1="340" y1="270" x2="340" y2="360" stroke="#dc2626" stroke-width="2"/>
    <rect x="332" y="278" width="16" height="66" fill="#dc2626"/>
    <circle cx="340" cy="378" r="10" fill="#2563eb"/><text x="340" y="382" text-anchor="middle" fill="#fff" font-weight="700">2</text>

    <!-- ③ vela sin mecha -->
    <rect x="372" y="300" width="16" height="44" fill="#16a34a"/>
    <circle cx="380" cy="286" r="10" fill="#2563eb"/><text x="380" y="290" text-anchor="middle" fill="#fff" font-weight="700">3</text>
  </g>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Entrada -->
  <text x="40" y="748" font-size="22" font-weight="700" fill="#0f172a">5 · Entrada: 3 opciones que se backtestean por separado</text>
  <g>
    <rect x="40" y="768" width="360" height="132" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="74" cy="800" r="16" fill="#2563eb"/><text x="74" y="806" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">1</text>
    <text x="102" y="806" font-size="17" font-weight="700" fill="#0f172a">Vela siguiente al CISD</text>
    <text x="60" y="838" font-size="14.5" fill="#334155">Entrada a mercado, a la apertura de la</text>
    <text x="60" y="858" font-size="14.5" fill="#334155">vela posterior a la que cierra el CISD.</text>
    <text x="60" y="884" font-size="14" font-weight="600" fill="#1e40af">Siempre entra si hay CISD</text>

    <rect x="420" y="768" width="360" height="132" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="454" cy="800" r="16" fill="#2563eb"/><text x="454" y="806" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">2</text>
    <text x="482" y="806" font-size="17" font-weight="700" fill="#0f172a">Retesteo del iFVG</text>
    <text x="440" y="838" font-size="14.5" fill="#334155">El precio continúa tras el CISD y vuelve a</text>
    <text x="440" y="858" font-size="14.5" fill="#334155">la zona del iFVG. Entrada al tocarla.</text>
    <text x="440" y="884" font-size="14" font-weight="600" fill="#1e40af">Si no vuelve, no hay entrada</text>

    <rect x="800" y="768" width="360" height="132" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
    <circle cx="834" cy="800" r="16" fill="#2563eb"/><text x="834" y="806" text-anchor="middle" font-size="17" font-weight="700" fill="#fff">3</text>
    <text x="862" y="806" font-size="17" font-weight="700" fill="#0f172a">Primera vela sin mecha</text>
    <text x="820" y="838" font-size="14.5" fill="#334155">Primera vela a favor, sin mecha, en el TF</text>
    <text x="820" y="858" font-size="14.5" fill="#334155">de entrada, después del CISD.</text>
    <text x="820" y="884" font-size="14" font-weight="600" fill="#1e40af">Exige un impulso limpio</text>
  </g>

  <!-- Gestión -->
  <text x="40" y="944" font-size="22" font-weight="700" fill="#0f172a">Gestión</text>
  <g>
    <rect x="40" y="964" width="265" height="150" rx="14" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="60" y="994" font-size="17" font-weight="700" fill="#b91c1c">Stop loss</text>
    <text x="60" y="1022" font-size="14.5" fill="#334155">Más allá de la mecha que</text>
    <text x="60" y="1042" font-size="14.5" fill="#334155">hizo el sweep (largos: bajo</text>
    <text x="60" y="1062" font-size="14.5" fill="#334155">su mínimo; cortos: sobre su</text>
    <text x="60" y="1082" font-size="14.5" fill="#334155">máximo).</text>

    <rect x="325" y="964" width="265" height="150" rx="14" fill="#f0fdf4" stroke="#86efac"/>
    <text x="345" y="994" font-size="17" font-weight="700" fill="#15803d">Take profit</text>
    <text x="345" y="1022" font-size="14.5" fill="#334155">1:2 (2R). Más adelante se</text>
    <text x="345" y="1042" font-size="14.5" fill="#334155">estudiará si se puede llegar</text>
    <text x="345" y="1062" font-size="14.5" fill="#334155">al extremo de la vela que</text>
    <text x="345" y="1082" font-size="14.5" fill="#334155">marcó el rango.</text>

    <rect x="610" y="964" width="265" height="150" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="630" y="994" font-size="17" font-weight="700" fill="#b45309">Break even</text>
    <text x="630" y="1022" font-size="14.5" fill="#334155">Al llegar a 1R el stop pasa</text>
    <text x="630" y="1042" font-size="14.5" fill="#334155">a la entrada.</text>

    <rect x="895" y="964" width="265" height="150" rx="14" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="915" y="994" font-size="17" font-weight="700" fill="#0f172a">Sesión</text>
    <text x="915" y="1022" font-size="14.5" fill="#334155">El cierre de sesión en</text>
    <text x="915" y="1042" font-size="14.5" fill="#334155">índices es a las 18:00 NY.</text>
  </g>

  <!-- Supuestos -->
  <rect x="40" y="1144" width="1120" height="250" rx="14" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="62" y="1178" font-size="19" font-weight="700" fill="#b45309">Supuestos míos por confirmar antes de programar</text>
  <g font-size="14.5" fill="#334155">
    <text x="62" y="1212">a) FVG tocado por el extremo del sweep: bajista en cortos, alcista en largos, y ya formado antes del sweep.</text>
    <text x="62" y="1240">b) El sweep de HTF debe cerrar dentro del rango de C1 (regla CRT original). Si cierra fuera, no hay patrón.</text>
    <text x="62" y="1268">c) A las 18:00 NY no se abren más entradas y lo que siga abierto se cierra. Hay que confirmarlo.</text>
    <text x="62" y="1296">d) Entrada ③: se entra a la apertura de la vela siguiente a la primera vela sin mecha.</text>
    <text x="62" y="1324">e) «Toca» = el máximo (mínimo) del sweep entra en la zona del FVG, aunque no la cruce entera.</text>
    <text x="62" y="1352">f) Una operación por sweep de HTF y sin reentradas tras el stop.</text>
    <text x="62" y="1380" font-size="13" fill="#64748b">Reglas definidas por el usuario salvo este recuadro. Sin backtest: nada de esto está medido todavía.</text>
  </g>
</svg>
