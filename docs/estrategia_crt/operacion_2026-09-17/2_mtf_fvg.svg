rl(#arr-dc2626)"/><text x="659.8" y="397.3" font-size="13" font-weight="700" fill="#dc2626" text-anchor="end" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round"><tspan x="659.8" dy="0">El mínimo del sweep (02:00, 29,091.06)</tspan><tspan x="659.8" dy="16">entra en el FVG</tspan></text><text x="54.0" y="558.0" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round"><tspan x="54.0" dy="0">MTF M30 · 16/09 12:30 – 17/09 08:00 NY · franja ámbar: la vela C2 (H3)</tspan></text><rect x="40.0" y="610" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#c2410c" stroke-width="1.5"/><text x="56.0" y="636" font-size="15" font-weight="700" fill="#c2410c">Paso 2 · FVG de MTF tocado (liquidez interna)</text><text x="56.0" y="660" font-size="13" fill="#334155">FVG alcista de M30: el hueco que dejan la mecha de</text><text x="56.0" y="679" font-size="13" fill="#334155">la vela 1 y la de la 3. Zona 29,090.06–29,117.51,</text><text x="56.0" y="698" font-size="13" fill="#334155">formada el 16/09 a las 19:30–20:00.</text><rect x="420.0" y="610" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/><text x="436.0" y="636" font-size="15" font-weight="700" fill="#16a34a">Lo que se comprueba</text><text x="436.0" y="660" font-size="13" fill="#334155">✓ El FVG ya estaba formado cuando empezó el sweep</text><text x="436.0" y="679" font-size="13" fill="#334155">✓ Sin mitigar: el precio no había entrado en la</text><text x="436.0" y="698" font-size="13" fill="#334155">zona desde su formación</text><text x="436.0" y="717" font-size="13" fill="#334155">✓ El extremo del sweep (29,091.06) cae dentro de</text><text x="436.0" y="736" font-size="13" fill="#334155">la zona</text><rect x="800.0" y="610" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="816.0" y="636" font-size="15" font-weight="700" fill="#64748b">Por qué importa</text><text x="816.0" y="660" font-size="13" fill="#334155">Además de la liquidez externa (el extremo de C1)</text><text x="816.0" y="679" font-size="13" fill="#334155">el precio ha tomado liquidez interna: un</text><text x="816.0" y="698" font-size="13" fill="#334155">desequilibrio que ya existía. Es la confirmación</text><text x="816.0" y="717" font-size="13" fill="#334155">de que el sweep llegó a una zona con órdenes.</text><text x="816.0" y="736" font-size="13" fill="#334155">Siguiente paso: bajar a M5 y buscar el iFVG.</text></svg>