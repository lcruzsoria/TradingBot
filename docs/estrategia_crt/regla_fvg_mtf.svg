<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif"><rect width="1200" height="640" fill="#f1f5f9"/><text x="40" y="44" font-size="26" font-weight="700" fill="#0f172a">Regla del FVG de MTF</text><text x="40" y="72" font-size="14" fill="#475569">El FVG se creó antes, en el desarrollo del precio, y queda más allá del extremo de C1: la mecha de C2 lo toca.</text><rect x="40" y="92" width="545" height="330" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="90" y="180" width="455" height="32" fill="#dc2626" opacity="0.18"/><rect x="90" y="180" width="455" height="32" fill="none" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="110" y1="150" x2="110" y2="180" stroke="#dc2626" stroke-width="2.2"/><rect x="98.0" y="156" width="24" height="20" fill="#dc2626"/><line x1="140" y1="172" x2="140" y2="260" stroke="#dc2626" stroke-width="2.2"/><rect x="128.0" y="178" width="24" height="72" fill="#dc2626"/><line x1="170" y1="212" x2="170" y2="270" stroke="#dc2626" stroke-width="2.2"/><rect x="158.0" y="248" width="24" height="14" fill="#dc2626"/><text x="110" y="142" font-size="11" fill="#64748b" text-anchor="middle">1</text><text x="140" y="142" font-size="11" fill="#64748b" text-anchor="middle">2</text><text x="170" y="142" font-size="11" fill="#64748b" text-anchor="middle">3</text><line x1="205" y1="253" x2="205" y2="302" stroke="#dc2626" stroke-width="2.2"/><rect x="196.0" y="260" width="18" height="36" fill="#dc2626"/><line x1="235" y1="290" x2="235" y2="325" stroke="#dc2626" stroke-width="2.2"/><rect x="226.0" y="296" width="18" height="22" fill="#dc2626"/><line x1="265" y1="278" x2="565" y2="278" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 4"/><text x="561" y="294" font-size="12" font-weight="700" fill="#2563eb" text-anchor="end">máximo de C1 (CRH)</text><line x1="300" y1="278" x2="300" y2="372" stroke="#16a34a" stroke-width="2.2"/><rect x="286.0" y="310" width="28" height="32" fill="#16a34a"/><text x="300" y="408" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">C1 (H3)</text><line x1="390" y1="198" x2="390" y2="346" stroke="#d97706" stroke-width="2.4"/><rect x="376" y="306" width="28" height="18" fill="#d97706"/><text x="390" y="408" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">C2 (H3)</text><circle cx="390" cy="198" r="6" fill="none" stroke="#0f172a" stroke-width="2.4"/><text x="406" y="202" font-size="12" font-weight="700" fill="#0f172a">toca el FVG</text><text x="190" y="238" font-size="13" font-weight="700" fill="#dc2626">FVG bajista de MTF (M15 / M30 / H1), creado antes</text><text x="190" y="255" font-size="12.5" fill="#334155">por encima del máximo de C1: tendencia bajista</text><text x="56" y="118" font-size="15" font-weight="700" fill="#0f172a">CORTO: C2 toma el máximo de C1 y vuelve al rango</text><rect x="615" y="92" width="545" height="330" rx="12" fill="#fff" stroke="#cbd5e1"/><rect x="665" y="302" width="455" height="32" fill="#16a34a" opacity="0.18"/><rect x="665" y="302" width="455" height="32" fill="none" stroke="#16a34a" stroke-width="1.4" stroke-dasharray="5 3"/><line x1="685" y1="364" x2="685" y2="334" stroke="#16a34a" stroke-width="2.2"/><rect x="673.0" y="338" width="24" height="20" fill="#16a34a"/><line x1="715" y1="342" x2="715" y2="254" stroke="#16a34a" stroke-width="2.2"/><rect x="703.0" y="264" width="24" height="72" fill="#16a34a"/><line x1="745" y1="302" x2="745" y2="244" stroke="#16a34a" stroke-width="2.2"/><rect x="733.0" y="252" width="24" height="14" fill="#16a34a"/><text x="685" y="376" font-size="11" fill="#64748b" text-anchor="middle">1</text><text x="715" y="376" font-size="11" fill="#64748b" text-anchor="middle">2</text><text x="745" y="376" font-size="11" fill="#64748b" text-anchor="middle">3</text><line x1="780" y1="261" x2="780" y2="212" stroke="#16a34a" stroke-width="2.2"/><rect x="771.0" y="218" width="18" height="36" fill="#16a34a"/><line x1="810" y1="224" x2="810" y2="189" stroke="#16a34a" stroke-width="2.2"/><rect x="801.0" y="196" width="18" height="22" fill="#16a34a"/><line x1="840" y1="236" x2="1140" y2="236" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 4"/><text x="1136" y="220" font-size="12" font-weight="700" fill="#2563eb" text-anchor="end">mínimo de C1 (CRH)</text><line x1="875" y1="236" x2="875" y2="142" stroke="#dc2626" stroke-width="2.2"/><rect x="861.0" y="172" width="28" height="32" fill="#dc2626"/><text x="875" y="408" font-size="13" font-weight="700" fill="#64748b" text-anchor="middle">C1 (H3)</text><line x1="965" y1="316" x2="965" y2="168" stroke="#d97706" stroke-width="2.4"/><rect x="951" y="190" width="28" height="18" fill="#d97706"/><text x="965" y="408" font-size="13" font-weight="700" fill="#d97706" text-anchor="middle">C2 (H3)</text><circle cx="965" cy="316" r="6" fill="none" stroke="#0f172a" stroke-width="2.4"/><text x="981" y="320" font-size="12" font-weight="700" fill="#0f172a">toca el FVG</text><text x="765" y="266" font-size="13" font-weight="700" fill="#15803d">FVG alcista de MTF (M15 / M30 / H1), creado antes</text><text x="765" y="283" font-size="12.5" fill="#334155">por debajo del mínimo de C1: tendencia alcista</text><text x="631" y="118" font-size="15" font-weight="700" fill="#0f172a">LARGO: C2 toma el mínimo de C1 y vuelve al rango</text><rect x="40.0" y="450" width="360.0" height="165" rx="12" fill="#f8fafc" stroke="#dc2626" stroke-width="1.5"/><text x="54.0" y="476" font-size="14.5" font-weight="700" fill="#dc2626">Corto (paso 1 y 2)</text><text x="54.0" y="500" font-size="13" fill="#334155">1) En H3, C2 toma el máximo de C1 y vuelve a entrar</text><text x="54.0" y="518" font-size="13" fill="#334155">en su rango. 2) Esa mecha toca un FVG BAJISTA de</text><text x="54.0" y="536" font-size="13" fill="#334155">MTF (M15, M30 o H1) creado antes, en el desarrollo</text><text x="54.0" y="554" font-size="13" fill="#334155">de la bajada, que queda por encima del máximo de</text><text x="54.0" y="572" font-size="13" fill="#334155">C1. Asegura tendencia bajista y liquidez interna</text><text x="54.0" y="590" font-size="13" fill="#334155">tomada.</text><rect x="420.0" y="450" width="360.0" height="165" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/><text x="434.0" y="476" font-size="14.5" font-weight="700" fill="#16a34a">Largo (el espejo)</text><text x="434.0" y="500" font-size="13" fill="#334155">1) C2 toma el mínimo de C1 y vuelve a entrar en su</text><text x="434.0" y="518" font-size="13" fill="#334155">rango. 2) Esa mecha toca un FVG ALCISTA de MTF</text><text x="434.0" y="536" font-size="13" fill="#334155">creado antes, en la subida, que queda por debajo</text><text x="434.0" y="554" font-size="13" fill="#334155">del mínimo de C1.</text><rect x="800.0" y="450" width="360.0" height="165" rx="12" fill="#f8fafc" stroke="#d97706" stroke-width="1.5"/><text x="814.0" y="476" font-size="14.5" font-weight="700" fill="#b45309">Qué cambia en el código</text><text x="814.0" y="500" font-size="13" fill="#334155">Antes se aceptaba también un FVG cuyo borde</text><text x="814.0" y="518" font-size="13" fill="#334155">coincidía con el extremo de C1 (formado dentro de</text><text x="814.0" y="536" font-size="13" fill="#334155">C1, sin tendencia detrás). Ahora la zona entera</text><text x="814.0" y="554" font-size="13" fill="#334155">tiene que estar más allá del extremo de C1 y sin</text><text x="814.0" y="572" font-size="13" fill="#334155">mitigar. Con NAS100 quita el 7 % de los setups.</text></svg>