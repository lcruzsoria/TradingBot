 en el HTF (liquidez externa)</text><text x="56.0" y="660" font-size="13" fill="#334155">C1 (30/07 09:00): máx 23,421.15, rango</text><text x="56.0" y="679" font-size="13" fill="#334155">23,330.90–23,421.15</text><text x="56.0" y="698" font-size="13" fill="#334155">C2 (30/07 12:00): máx 23,471.15, cierre 23,293.90</text><rect x="420.0" y="610" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/><text x="436.0" y="636" font-size="15" font-weight="700" fill="#16a34a">Lo que se comprueba</text><text x="436.0" y="660" font-size="13" fill="#334155">✓ C2 supera el máximo de C1 → dirección: corto</text><text x="436.0" y="679" font-size="13" fill="#334155">✓ C2 cierra dentro del rango de C1 (no es una</text><text x="436.0" y="698" font-size="13" fill="#334155">rotura)</text><text x="436.0" y="717" font-size="13" fill="#334155">✓ C2 no barre el otro extremo de C1</text><rect x="800.0" y="610" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="816.0" y="636" font-size="15" font-weight="700" fill="#64748b">Contexto del mercado</text><text x="816.0" y="660" font-size="13" fill="#334155">En la ventana, el mínimo fue 23,201.35 (25/07) y</text><text x="816.0" y="679" font-size="13" fill="#334155">desde ahí el precio subió un 0.9 % hasta el</text><text x="816.0" y="698" font-size="13" fill="#334155">extremo de C1: la zona de máximos acumula stops</text><text x="816.0" y="717" font-size="13" fill="#334155">que el mercado busca antes de girar.</text></svg>