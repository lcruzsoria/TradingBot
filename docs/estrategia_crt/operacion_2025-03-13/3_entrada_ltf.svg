nejoin:round"><tspan x="346.6" dy="0">FVG alcista M5 (06:00)</tspan><tspan x="346.6" dy="15">se convertirá en iFVG</tspan></text><line x1="421.7" y1="186.0" x2="535.2" y2="238.8" stroke="#7c3aed" stroke-width="1.6" marker-end="url(#arr-7c3aed)"/><text x="415.7" y="164.0" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="end" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round"><tspan x="415.7" dy="0">06:50 la vela cierra bajo la base del FVG (19,586.75) → iFVG</tspan><tspan x="415.7" dy="15">y bajo la apertura de la secuencia (19,596.25) → CISD</tspan></text><circle cx="539.2" cy="242.8" r="6" fill="#7c3aed" stroke="#7c3aed" stroke-width="2.2"/><line x1="590.8" y1="204.9" x2="559.8" y2="240.9" stroke="#2563eb" stroke-width="1.6" marker-end="url(#arr-2563eb)"/><text x="596.8" y="194.9" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round"><tspan x="596.8" dy="0">06:55 ENTRADA 1: a mercado en la</tspan><tspan x="596.8" dy="15">apertura de la vela siguiente</tspan><tspan x="596.8" dy="15">a la del CISD (19,578.50)</tspan></text><circle cx="802.0" cy="431.4" r="7" fill="#16a34a" stroke="#16a34a" stroke-width="2.2"/><text x="794.0" y="455.4" font-size="12" font-weight="700" fill="#16a34a" text-anchor="end" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round"><tspan x="794.0" dy="0">08:05 objetivo 2R</tspan></text><text x="54.0" y="588.0" font-size="12" font-weight="500" fill="#64748b" text-anchor="start" style="paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round"><tspan x="54.0" dy="0">LTF M5 · 13/03 04:30 – 13/03 09:15 NY</tspan></text><rect x="40.0" y="640" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/><text x="56.0" y="666" font-size="15" font-weight="700" fill="#7c3aed">Paso 3 · iFVG en M5</text><text x="56.0" y="690" font-size="13" fill="#334155">El tramo alcista del sweep dejó un FVG alcista en</text><text x="56.0" y="709" font-size="13" fill="#334155">M5 (zona 19,586.75–19,592.00). La vela de las</text><text x="56.0" y="728" font-size="13" fill="#334155">06:50 cierra bajo su base (19,586.75): el FVG se</text><text x="56.0" y="747" font-size="13" fill="#334155">invierte (iFVG).</text><rect x="420.0" y="640" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#7c3aed" stroke-width="1.5"/><text x="436.0" y="666" font-size="15" font-weight="700" fill="#7c3aed">Paso 4 · CISD</text><text x="436.0" y="690" font-size="13" fill="#334155">La secuencia de velas alcistas que hizo el sweep</text><text x="436.0" y="709" font-size="13" fill="#334155">abrió en 19,596.25. A las 06:50 una vela cierra</text><text x="436.0" y="728" font-size="13" fill="#334155">por debajo (19,579.50): cambio de entrega. Se mide</text><text x="436.0" y="747" font-size="13" fill="#334155">en el mismo TF (M5).</text><rect x="800.0" y="640" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/><text x="816.0" y="666" font-size="15" font-weight="700" fill="#2563eb">Paso 5 · entrada y gestión</text><text x="816.0" y="690" font-size="13" fill="#334155">Entrada 1 en M5: a mercado en 19,578.50. Stop en</text><text x="816.0" y="709" font-size="13" fill="#334155">el extremo del sweep (19,623.25), riesgo 44.75</text><text x="816.0" y="728" font-size="13" fill="#334155">pts. TP 2R en 19,489.00; a 1R (19,533.75) el stop</text><text x="816.0" y="747" font-size="13" fill="#334155">pasa a la entrada. Resultado: objetivo, +2.00 R</text><text x="816.0" y="766" font-size="13" fill="#334155">bruto (+1.96 R con spread).</text></svg>