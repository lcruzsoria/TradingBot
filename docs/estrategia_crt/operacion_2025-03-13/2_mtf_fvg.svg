" rx="12" fill="#f8fafc" stroke="#16a34a" stroke-width="1.5"/><text x="436.0" y="636" font-size="15" font-weight="700" fill="#16a34a">Lo que se comprueba</text><text x="436.0" y="660" font-size="13" fill="#334155">✓ El FVG ya estaba formado cuando empezó el sweep</text><text x="436.0" y="679" font-size="13" fill="#334155">✓ Sin mitigar: el precio no había entrado en la</text><text x="436.0" y="698" font-size="13" fill="#334155">zona desde su formación</text><text x="436.0" y="717" font-size="13" fill="#334155">✓ El extremo del sweep (19,623.25) cae dentro de</text><text x="436.0" y="736" font-size="13" fill="#334155">la zona</text><rect x="800.0" y="610" width="360.0" height="176" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="816.0" y="636" font-size="15" font-weight="700" fill="#64748b">Por qué importa</text><text x="816.0" y="660" font-size="13" fill="#334155">Además de la liquidez externa (el extremo de C1)</text><text x="816.0" y="679" font-size="13" fill="#334155">el precio ha tomado liquidez interna: un</text><text x="816.0" y="698" font-size="13" fill="#334155">desequilibrio que ya existía. Es la confirmación</text><text x="816.0" y="717" font-size="13" fill="#334155">de que el sweep llegó a una zona con órdenes.</text><text x="816.0" y="736" font-size="13" fill="#334155">Siguiente paso: bajar a M5 y buscar el iFVG.</text></svg>