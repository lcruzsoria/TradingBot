[project]
name = "tradingbot"
version = "0.1.0"
description = "TradingBot: conexión a MetaTrader 5, sesgo (Bias) de la sesión e interfaz gráfica"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PySide6>=6.6",
    "pyqtgraph>=0.13.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "tzdata>=2024.1",   # base de zonas horarias (Windows no la trae)
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
